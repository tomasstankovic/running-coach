schema_version: "1.1"
name: en-marathon-sub-2-45
expected_outcome: |
  A 34-year-old with 2:51:20 and a 1:20:05 half at ~85 km a week wants sub-2:45 (about 3:54-3:55/km) in London on 25 April 2027, about 25 weeks away. The coach is honest: the half predicts roughly 2:46-2:49, so 2:45 needs about a 1:18-1:19 half fitness; it is realistic on conditions but not certain with more volume and specific endurance, and a check point (a half in February or March) decides the goal pace. Double threshold is offered at most as an option and labelled as not proven for amateurs (Norwegian singles, sub-threshold days, are the gentler choice); the easy running stays easy. Volume rises gradually toward roughly 95-120 km with recovery weeks, doubles only as easy running; two quality sessions a week, long runs of 32-35 km with long marathon-pace segments, a tune-up half, taper, fuelling 60-90 g an hour, even pacing. English.
