schema_version: "1.1"
name: en-taper-marathon-miles
expected_outcome: |
  A marathon in 10 days, a runner who thinks in miles. The coach gives the taper: volume down about 40-60 % over the last 10 days while keeping some marathon-pace or faster running, a short sharpening session 3-4 days before (e.g. a few miles or reps at marathon pace), easy runs and a short shakeout the day before; carbohydrate loading of about 10-12 g/kg for the last 36-48 h, about 750-900 g a day at 165 lb (75 kg), low fibre; a breakfast of about 1-4 g/kg 1-4 h before; nothing new on race day; even pacing at about 8:35/mile for 3:45 with fuelling during the race. All distances and paces in miles. English.
