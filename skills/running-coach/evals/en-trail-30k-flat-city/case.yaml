schema_version: "1.1"
name: en-trail-30k-flat-city
expected_outcome: |
  A road runner from a flat city preparing a 30 km trail race with 1,500 m of climbing in 10 weeks. The coach plans vertical without hills nearby (treadmill incline, stairs or a tall building, bridges or short local hills as repeats), weekend long runs in the hills when possible, practice of power-hiking steep climbs and of downhills, eccentric leg strength (e.g. step-downs, lunges) for the descents, long runs by time and effort rather than pace, building safely toward about 3-3.5 h on feet, and fuelling and drinking for a race of about 4 h, practised in training. English.
