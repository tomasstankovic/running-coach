schema_version: "1.1"
name: en-marathon-sub3-from-3-08
expected_outcome: |
  A 38-year-old with a 3:08 marathon and a 1:25:10 half at ~60 km a week wants sub-3 (4:15-4:16/km) in Vienna on 18 April 2027, about 23 weeks away. The coach is honest with numbers: the half predicts roughly 2:57-3:00 for a runner with the endurance for it, so sub-3 is realistic but not given, and depends on building volume and marathon-specific endurance; a check point (a half around 1:23-1:24 in February or March) tells whether it is on. The plan raises volume gradually (about 10 % steps with recovery weeks) toward roughly 70-85 km within the 6-7 hours, keeps most running easy, two quality sessions a week (threshold or sub-threshold, later marathon pace), long runs up to 30-32 km with long marathon-pace segments (for example 14-16 km at 4:15/km), a tune-up half, a 2-3 week taper, and a race plan with even pacing and 60-90 g of carbohydrate an hour practised in training. English.
