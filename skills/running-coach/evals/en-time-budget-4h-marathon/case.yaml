schema_version: "1.1"
name: en-time-budget-4h-marathon
expected_outcome: |
  A parent with 4 hours a week wants a sub-4 marathon in 16 weeks from a 1:52 half. The coach is honest: 4 hours is about 35-40 km a week, at or below the ~40 km a week a marathon needs, so sub-4 (5:41/km) is a stretch; Riegel from 1:52 says ~3:53 but at this volume a more realistic range is about 4:00-4:15. It uses the 4 hours on 3-4 runs with the long run as the priority (up to about 1:45-2:00 within the budget, maybe a little more on some weekends), one or two quality sessions (sub-threshold, then marathon pace inside the long run), the rest easy, and says an extra hour would go to easy running and the long run; strength stays short and doesn't replace running. English.
