name: durability-long-run
expected_outcome: |
  The coach runs analyze_session.py on analysis.json (steady 2:20, 26.6 km): decoupling ~5.9-9.1 %, and durability: about 9 % of efficiency lost in the last quarter (5:15/km at 141 bpm -> 5:24/km at 152 bpm), a large fade and a marathon limiter. It explains it in plain words, asks or considers what was eaten and the weather (fuelling, heat and hills affect it), and suggests what builds durability: longer long runs, marathon pace late in long runs, and fuelling practice (30 -> 90 g/h step by step). 31 % above the easy cap is noted. Slovak.
