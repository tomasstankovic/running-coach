name: en-half-sub90-from-1-33
expected_outcome: |
  A 29-year-old with a 1:33:40 half and a 43:10 10k at ~40 km a week (4 runs, max 5 hours) wants sub-1:30 (4:16/km) on 11 April 2027, about 22 weeks away. The coach is honest: the 10k predicts about 1:35, so the runner needs about 4 % more, roughly a 40:45-41:30 10k fitness; realistic over 22 weeks but not certain, with a check point (a 10k around 41:00-41:30 in February or March). Within 5 hours: volume rises gradually to about 45-55 km, long run up to 18-22 km, two quality sessions (threshold/sub-threshold, later half-marathon-pace blocks such as 3 x 3 km to 2 x 6 km at 4:15/km), strength twice a week briefly, taper 7-10 days, even pacing. English.
