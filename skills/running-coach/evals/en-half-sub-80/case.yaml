name: en-half-sub-80
expected_outcome: |
  A runner with a 1:22:30 half and a 17:05 5k at ~70 km a week wants sub-1:20 (3:47/km) on 7 March 2027, about 17 weeks away. The coach spots the gap: the 5k predicts about 1:18-1:19:30 for the half, so speed is there and the limiter is endurance at half-marathon pace (or the race pacing). Training leans on threshold/sub-threshold and half-marathon-pace work (blocks growing to about 10-12 km at 3:45-3:47/km), long runs of about 22-26 km, possibly with a fast finish; volume rises gradually toward about 75-85 km with recovery weeks; the easy running stays easy; a tune-up race or dress rehearsal 2-5 weeks out and a 10-14 day taper. English.
