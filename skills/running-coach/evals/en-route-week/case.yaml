schema_version: "1.1"
name: en-route-week
expected_outcome: |
  Near miss for routing: the same files as en-route-long-run, but the runner asks how the week went. Review mode: plan vs actual (62 km planned, 52.7 km run, about 85 %), the missed Thursday (work trip, not made up), Tuesday's threshold reps on target (4:14-4:16 vs 4:12-4:18), and the long run as one part of the week, including that it faded at the end (from analysis.json or the note). It does not answer with only a long-run analysis. English.
context:
