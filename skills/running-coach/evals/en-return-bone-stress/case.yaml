schema_version: "1.1"
name: en-return-bone-stress
expected_outcome: |
  Back from a tibial bone stress injury after 7 weeks off, cleared by the physio. The coach plans a conservative return: short easy runs or run-walk on alternate days at first, well under the previous 45 km (roughly a third to a half of it in the first weeks), progressing only if there is no pain at the site during or the day after, no quality or long runs for the first few weeks, then a gradual build that can still make a March 10k. It asks about the risk factors behind a bone stress injury (energy availability and eating, for women menstrual cycle, previous stress injuries, sudden load jumps, footwear) and suggests checking them with a doctor or sports dietitian, and keeps working with the physio. English.
