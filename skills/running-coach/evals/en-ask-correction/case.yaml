schema_version: "1.1"
name: en-ask-correction
expected_outcome: |
  Two-turn case: history.jsonl replays the first turn of en-ask-contradiction (the runner asked for 6 runs, about 65 km and a 22 km long run; the coach named the conflict with the profile's 3 runs and 3 hours, planned a 3-run week of about 30 km and asked whether the availability had changed). Now the runner corrects the input: 5 runs a week on Monday, Tuesday, Thursday, Saturday and Sunday, about 5 hours, and drops the 65 km and 22 km. The coach uses the correction instead of carrying the old assumption forward: next week runs only on those days, adds at least one of the new days (Monday or Saturday) or says when, and builds towards 5 runs and 5 hours (not the old 3-run limit, not 6 runs), volume grows gradually from the recent ~30 km (about 33-36 km, not 65), the long run stays at or under about 15.4 km (14 km + 10 %), and at most one or two of the runs are hard. The load check (check_week.py) runs on the corrected week, and the answer agrees with its output, so the correction reaches the calculation and not only the wording. English.
context:
  scaffold_script: place-files.sh
  history_file: history.jsonl
