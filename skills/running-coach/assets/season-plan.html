<title>Season Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a race-season ledger. Header with races, a strip of key numbers, race predictions, the
   week-by-week volume chart with phases underneath, then the full week table and the change log. */
:root {
  --bg: #F6F7F9; --surface: #FFFFFF; --fg: #1E2A44; --muted: #5E6A80; --line: #DDE2EA;
  --accent: #FF6B4A; --accent-soft: #FFE3DB;
  --base: #8FB3D9; --build: #3F7CBF; --specific: #1E2A44; --taper: #F2A541; --race: #FF6B4A; --recovery: #A9B4C4;
  --good: #2E8B57; --warn: #C27C0E;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Public Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161F; --surface: #19202C; --fg: #EEF1F6; --muted: #9AA6BA; --line: #2A3342;
  --accent: #FF7D5E; --accent-soft: #3A2620;
  --base: #5F86B0; --build: #6FA3DD; --specific: #C9D6EA; --taper: #F2B35E; --race: #FF7D5E; --recovery: #6B778A;
  --good: #5CC08A; --warn: #E6A43C; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161F; --surface: #19202C; --fg: #EEF1F6; --muted: #9AA6BA; --line: #2A3342;
  --accent: #FF7D5E; --accent-soft: #3A2620;
  --base: #5F86B0; --build: #6FA3DD; --specific: #C9D6EA; --taper: #F2B35E; --race: #FF7D5E; --recovery: #6B778A;
  --good: #5CC08A; --warn: #E6A43C; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
h1, h2 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.05; }
h2 { font-size: 1.35rem; text-transform: uppercase; letter-spacing: .06em; }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }

header { display: grid; gap: 12px; }
.races { display: flex; flex-wrap: wrap; gap: 8px; }
.race { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: .9rem; }
.race b { font-family: var(--display); font-size: 1rem; }
.prio { font-family: var(--display); font-weight: 700; color: var(--bg); background: var(--muted);
  border-radius: 4px; padding: 0 6px; font-size: .85rem; }
.prio.A { background: var(--race); } .prio.B { background: var(--build); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.stat .big { font-family: var(--display); font-size: 2rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: .85rem; color: var(--muted); }

section { display: grid; gap: 12px; min-width: 0; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 8px 8px; overflow-x: auto; }
.chart svg { display: block; min-width: 560px; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw.dot { border-radius: 50%; background: var(--fg); width: 8px; height: 8px; }

.table { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: .9rem; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.n { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
tr.now td { background: var(--accent-soft); }
tr.now td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.role { font-size: .78rem; color: var(--muted); }
.delta.ok { color: var(--good); } .delta.off { color: var(--warn); }

.log { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.log li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.log li:last-child { border-bottom: 0; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px; display: grid; gap: 6px; }
footer { font-size: .8rem; color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.panel svg { display: block; width: 100%; height: auto; }
.panel .cap { font-size: .82rem; color: var(--muted); margin-top: 6px; }
.days { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.days li { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); }
.days li:last-child { border-bottom: 0; }
.days li.today .d { color: var(--accent); font-weight: 600; }
.days li.done .t { color: var(--muted); }
.days .d { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.days .v { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .9rem; }
.ok { color: var(--good); }
.pred { display: grid; gap: 4px; }
.pred .big { font-family: var(--display); font-size: 2rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.pred .sub { font-size: .85rem; color: var(--muted); }
.pred svg { margin-top: 6px; }
.gap.ok { color: var(--good); } .gap.warn { color: var(--warn); } .gap.off { color: var(--race); }
table.form { min-width: 0; font-size: .9rem; }
table.form td, table.form th { padding: 6px 8px; }
@media (max-width: 480px) { .log li { grid-template-columns: 1fr; gap: 0; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Running Coach</div>
    <h1 id="title">Season plan</h1>
    <div class="races" id="races"></div>
  </header>

  <div id="empty" class="empty">
    <strong id="emptyTitle">Loading the plan…</strong>
    <span class="muted" id="emptyText">The weeks appear here once your coach has saved the season plan.</span>
  </div>

  <div id="content" hidden>
    <div class="wrap" style="padding:0">
      <div class="stats" id="stats"></div>

      <section id="weekSection" hidden>
        <h2 id="hWeek">This week</h2>
        <div class="panel"><ul class="days" id="days"></ul></div>
      </section>

      <section id="predSection" hidden>
        <h2 id="hPred">Race predictions</h2>
        <div class="two" id="predRaces"></div>
        <div class="panel" id="formPanel" hidden>
          <div class="eyebrow" id="hForm">Current form</div>
          <table class="form"><thead><tr id="formHead"></tr></thead><tbody id="formBody"></tbody></table>
          <div class="cap" id="predCap"></div>
        </div>
      </section>

      <section>
        <h2 id="hChart">Volume by week</h2>
        <div class="chart"><svg id="chart" role="img" aria-label="Planned and actual weekly volume"></svg></div>
        <div class="legend" id="legend"></div>
      </section>

      <div class="two" id="trendRow" hidden>
        <section id="readySection" hidden>
          <h2 id="hReady">Readiness</h2>
          <div class="panel"><svg id="readyChart" role="img" aria-label="7-day HRV against the normal band"></svg>
            <div class="cap" id="readyCap"></div></div>
        </section>
        <section id="efSection" hidden>
          <h2 id="hEf">Aerobic fitness</h2>
          <div class="panel"><svg id="efChart" role="img" aria-label="Efficiency factor of steady runs"></svg>
            <div class="cap" id="efCap"></div></div>
        </section>
      </div>

      <section>
        <h2 id="hWeeks">Weeks</h2>
        <div class="table"><table>
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table></div>
      </section>

      <section id="logSection" hidden>
        <h2 id="hLog">Changes</h2>
        <ul class="log" id="log"></ul>
      </section>

      <footer id="footer"></footer>
    </div>
  </div>
</div>

<script>
const T = {
  en: { loading: "Loading the plan…", emptyT: "No plan saved yet",
    emptyX: "The weeks appear here once your coach has saved the season plan.",
    failT: "The plan couldn't be loaded", failX: "Reload the page. If it keeps failing, ask your coach to publish the plan again.",
    chart: "Volume by week", weeks: "Weeks", log: "Changes", thisWeek: "This week", nextRace: "Next race",
    peak: "Peak week", done: "Done so far", weeksTo: w => w === 0 ? "this week" : w === 1 ? "in 1 week" : `in ${w} weeks`,
    planned: "planned", actual: "actual", long: "long run", updated: "Updated",
    cols: ["#", "Week", "Phase", "Plan", "Actual", "Long", "Key session"],
    phase: { base: "base", build: "build", specific: "specific", taper: "taper", race: "race", recovery: "recovery" },
    role: { deload: "deload", busy: "busy week", "race-B": "B race", taper: "taper", race: "race", recovery: "recovery", build: "" },
    of: "of", pastWeeks: "weeks with data",
    week: "This week", ready: "Readiness", ef: "Aerobic fitness",
    readyCap: (v, lo, hi) => `HRV 7-day mean ${v} · normal band ${lo}–${hi}. Below the band: no quality, then −25 % volume.`,
    efCap: (n, d) => `Efficiency factor of ${n} steady runs (higher = fitter)` + (d != null ? ` · last decoupling ${d} %` : ""),
    verdict: { GREEN: "green", AMBER: "amber", RED: "red" },
    pred: "Race predictions", form: "Current form", likely: "likely", range: "range",
    formCols: ["Distance", "Likely", "Range", "Pace"], half: "Half marathon", marathon: "Marathon",
    goal: g => `goal ${g}`, inRange: "inside the range", stretch: p => `${p} % faster than the fast end: a stretch`,
    outOf: p => `${p} % faster than the fast end: out of reach for now`, safe: "slower than the range: safe",
    predCap: d => `As of ${d}. Updated in every weekly review: new races, tests and the plan's volume move it.`,
    trendCap: "Likely time over the weeks (higher = faster), band = range, dashed = goal" },
  sk: { loading: "Načítavam plán…", emptyT: "Plán ešte nie je uložený",
    emptyX: "Týždne sa tu objavia, keď tréner uloží plán sezóny.",
    failT: "Plán sa nepodarilo načítať", failX: "Obnov stránku. Ak to nepomôže, požiadaj trénera, aby plán zverejnil znova.",
    chart: "Objem po týždňoch", weeks: "Týždne", log: "Zmeny", thisWeek: "Tento týždeň", nextRace: "Najbližší závod",
    peak: "Najväčší týždeň", done: "Zatiaľ odbehnuté", weeksTo: w => w === 0 ? "tento týždeň" : w === 1 ? "o 1 týždeň" : w < 5 ? `o ${w} týždne` : `o ${w} týždňov`,
    planned: "plán", actual: "skutočnosť", long: "dlhý beh", updated: "Aktualizované",
    cols: ["#", "Týždeň", "Fáza", "Plán", "Skutočnosť", "Dlhý", "Kľúčový tréning"],
    phase: { base: "základ", build: "budovanie", specific: "špecifická", taper: "ladenie", race: "závod", recovery: "regenerácia" },
    role: { deload: "odľahčenie", busy: "vyťažený týždeň", "race-B": "B závod", taper: "ladenie", race: "závod", recovery: "regenerácia", build: "" },
    of: "z", pastWeeks: "týždňov s dátami",
    week: "Tento týždeň", ready: "Pripravenosť", ef: "Aerobná forma",
    readyCap: (v, lo, hi) => `HRV 7-dňový priemer ${v} · bežné pásmo ${lo}–${hi}. Pod pásmom: bez kvality, potom −25 % objemu.`,
    efCap: (n, d) => `Efektivita (EF) ${n} ustálených behov (vyššie = lepšia forma)` + (d != null ? ` · posledný decoupling ${d} %` : ""),
    verdict: { GREEN: "zelená", AMBER: "oranžová", RED: "červená" },
    pred: "Predikcie", form: "Aktuálna forma", likely: "najpravdepodobnejšie", range: "rozpätie",
    formCols: ["Trať", "Odhad", "Rozpätie", "Tempo"], half: "Polmaratón", marathon: "Maratón",
    goal: g => `cieľ ${g}`, inRange: "v rozpätí", stretch: p => `o ${p} % rýchlejší než rýchly koniec: náročný cieľ`,
    outOf: p => `o ${p} % rýchlejší než rýchly koniec: zatiaľ mimo dosahu`, safe: "pomalší než rozpätie: bezpečný",
    predCap: d => `Stav k ${d}. Aktualizuje sa pri každom týždennom hodnotení: nové závody, testy a objem z plánu ho posúvajú.`,
    trendCap: "Odhad času v priebehu týždňov (vyššie = rýchlejšie), pás = rozpätie, čiarkovane = cieľ" },
};
const PHASES = ["base", "build", "specific", "taper", "race", "recovery"];
const state = { meta: null, weeks: null, changes: [], trends: [], sessions: [], predictions: [] };
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, text) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; return e; };
const svgEl = (tag, attrs = {}, text) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; return e; };

function lang() { return T[(state.meta && state.meta.lang) || "en"] || T.en; }
function mondayISO(d) { const x = new Date(d); x.setHours(12); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x.toISOString().slice(0, 10); }
function fmtDate(iso, opts = { day: "numeric", month: "numeric" }) {
  const l = (state.meta && state.meta.lang) === "sk" ? "sk-SK" : "en-GB";
  return new Date(iso + "T12:00:00").toLocaleDateString(l, opts);
}
function useTime() { return state.meta && state.meta.unit === "time"; }
function vol(km, minutes) { return useTime() ? `${(minutes / 60).toFixed(1)} h` : `${Math.round(km)} km`; }
function fmtT(secs) {
  secs = Math.round(secs); const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60), s = secs % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}
function phaseColor(p) { return `var(--${PHASES.includes(p) ? p : "base"})`; }

function showEmpty(titleKey, textKey) {
  const t = lang(); $("content").hidden = true; $("empty").hidden = false;
  $("emptyTitle").textContent = t[titleKey]; $("emptyText").textContent = t[textKey];
}

function render() {
  const t = lang(), m = state.meta || {}, weeks = (state.weeks || []).slice().sort((a, b) => a.week_start < b.week_start ? -1 : 1);
  if (m.title) { $("title").textContent = m.title; document.title = m.title; }
  if (!weeks.length) { if (state.weeks) showEmpty("emptyT", "emptyX"); return; }
  $("empty").hidden = true; $("content").hidden = false;
  const today = mondayISO(new Date());

  // races
  const races = $("races"); races.replaceChildren();
  (m.races || []).slice().sort((a, b) => a.date < b.date ? -1 : 1).forEach(r => {
    const c = el("span", { class: "race" });
    c.append(el("span", { class: `prio ${r.priority}` }, r.priority), el("b", {}, r.name),
      el("span", { class: "muted" }, `${fmtDate(r.date, { day: "numeric", month: "numeric", year: "numeric" })}${r.distance_km ? " · " + r.distance_km + " km" : ""}`));
    races.append(c);
  });

  // stats
  const cur = weeks.find(w => w.week_start === today);
  const next = (m.races || []).filter(r => r.date >= today).sort((a, b) => a.date < b.date ? -1 : 1)[0];
  const peak = weeks.reduce((a, w) => (w.km > a.km ? w : a), weeks[0]);
  const past = weeks.filter(w => w.week_start < today && w.actual_km != null);
  const doneKm = past.reduce((s, w) => s + (w.actual_km || 0), 0), doneMin = past.reduce((s, w) => s + (w.actual_minutes || 0), 0);
  const stats = $("stats"); stats.replaceChildren();
  const stat = (label, big, sub) => { const s = el("div", { class: "stat" }); s.append(el("div", { class: "eyebrow" }, label), el("div", { class: "big" }, big), el("div", { class: "sub" }, sub)); stats.append(s); };
  if (cur) stat(t.thisWeek, vol(cur.km, cur.minutes), `${t.phase[cur.phase] || cur.phase}${t.role[cur.role] ? " · " + t.role[cur.role] : ""} · ${cur.key}`);
  if (next) { const wks = Math.round((new Date(mondayISO(next.date)) - new Date(today)) / 6048e5); stat(t.nextRace, t.weeksTo(wks), `${next.priority} · ${next.name} · ${fmtDate(next.date)}`); }
  stat(t.peak, vol(peak.km, peak.minutes), `${fmtDate(peak.week_start)} · ${t.long} ${peak.long_km} km`);
  if (past.length) stat(t.done, vol(doneKm, doneMin), `${past.length} ${t.pastWeeks}`);

  drawChart(weeks, today, t);
  renderWeek(cur, t);
  renderTrends(t);
  renderPredictions(t);

  // legend
  const lg = $("legend"); lg.replaceChildren();
  PHASES.filter(p => weeks.some(w => w.phase === p)).forEach(p => { const s = el("span"); const sw = el("i", { class: "sw" }); sw.style.background = phaseColor(p); s.append(sw, t.phase[p]); lg.append(s); });
  const a = el("span"); a.append(el("i", { class: "sw dot" }), t.actual); lg.append(a);

  // table
  $("hChart").textContent = t.chart; $("hWeeks").textContent = t.weeks; $("hLog").textContent = t.log;
  const th = $("thead"); th.replaceChildren(...t.cols.map((c, i) => el("th", i === 0 || (i >= 3 && i <= 5) ? { style: "text-align:right" } : {}, c)));
  const tb = $("tbody"); tb.replaceChildren();
  weeks.forEach((w, i) => {
    const tr = el("tr", w.week_start === today ? { class: "now" } : {});
    const ph = el("td"); const pill = el("span", { class: "pill" }); const sw = el("i", { class: "sw" }); sw.style.background = phaseColor(w.phase);
    pill.append(sw, t.phase[w.phase] || w.phase_label || w.phase); ph.append(pill);
    if (t.role[w.role]) ph.append(el("div", { class: "role" }, t.role[w.role]));
    const act = el("td", { class: "n" });
    if (w.actual_km != null) {
      const ratio = w.km ? w.actual_km / w.km : 1;
      act.append(el("span", { class: `delta ${ratio >= 0.85 && ratio <= 1.15 ? "ok" : "off"}` }, vol(w.actual_km, w.actual_minutes || 0)));
    } else act.textContent = "–";
    const key = el("td", {}, w.key || "");
    if (w.note) key.append(el("div", { class: "role" }, w.note));
    tr.append(el("td", { class: "n" }, String(w.n || i + 1)), el("td", {}, fmtDate(w.week_start)), ph,
      el("td", { class: "n" }, vol(w.km, w.minutes)), act, el("td", { class: "n" }, `${w.long_km} km`), key);
    tb.append(tr);
  });

  // change log
  const changes = state.changes.slice().sort((a, b) => a.date < b.date ? 1 : -1);
  $("logSection").hidden = !changes.length;
  $("log").replaceChildren(...changes.map(c => { const li = el("li"); li.append(el("span", { class: "muted num" }, fmtDate(c.date, { day: "numeric", month: "numeric", year: "numeric" })), el("span", {}, c.text)); return li; }));
  $("footer").textContent = m.updated ? `${t.updated} ${fmtDate(m.updated, { day: "numeric", month: "numeric", year: "numeric" })}` : "";
}

function drawChart(weeks, today, t) {
  const svg = $("chart"); svg.replaceChildren();
  const W = 1000, H = 300, padL = 44, padR = 12, padT = 28, padB = 52;
  const val = w => useTime() ? (w.minutes || 0) / 60 : w.km;
  const act = w => w.actual_km == null ? null : (useTime() ? (w.actual_minutes || 0) / 60 : w.actual_km);
  const max = Math.max(...weeks.map(w => Math.max(val(w), act(w) || 0))) * 1.1 || 1;
  const step = Math.pow(10, Math.floor(Math.log10(max))) * (max / Math.pow(10, Math.floor(Math.log10(max))) > 5 ? 2 : 1);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const bw = (W - padL - padR) / weeks.length, y = v => padT + (H - padT - padB) * (1 - v / max);
  for (let v = 0; v <= max; v += step) {
    svg.append(svgEl("line", { x1: padL, x2: W - padR, y1: y(v), y2: y(v), stroke: "var(--line)", "stroke-width": 1 }));
    svg.append(svgEl("text", { x: padL - 8, y: y(v) + 4, "text-anchor": "end", "font-size": 12, fill: "var(--muted)", "font-family": "var(--body)" }, String(Math.round(v))));
  }
  svg.append(svgEl("text", { x: padL - 8, y: 14, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, useTime() ? "h" : "km"));
  const actualPts = [];
  weeks.forEach((w, i) => {
    const x = padL + i * bw, light = ["deload", "busy", "recovery"].includes(w.role);
    const r = svgEl("rect", { x: x + bw * 0.15, y: y(val(w)), width: bw * 0.7, height: Math.max(0, y(0) - y(val(w))), rx: 2,
      fill: phaseColor(w.phase), opacity: light ? 0.55 : 1 });
    r.append(svgEl("title", {}, `${fmtDate(w.week_start)} · ${t.planned} ${vol(w.km, w.minutes)}${act(w) != null ? " · " + t.actual + " " + vol(w.actual_km, w.actual_minutes || 0) : ""} · ${w.key}`));
    svg.append(r);
    if (act(w) != null) actualPts.push([x + bw / 2, y(act(w))]);
    if (w.week_start === today) {
      svg.append(svgEl("rect", { x: x + 1, y: padT - 6, width: bw - 2, height: y(0) - padT + 6, fill: "none", stroke: "var(--accent)", "stroke-width": 2, rx: 3 }));
    }
    if (w.role === "race" || w.role === "race-B") {
      svg.append(svgEl("text", { x: x + bw / 2, y: y(val(w)) - 8, "text-anchor": "middle", "font-size": 13, "font-weight": 700, fill: "var(--race)", "font-family": "var(--display)" }, w.role === "race" ? "A" : "B"));
    }
    const first = i === 0 || new Date(w.week_start).getMonth() !== new Date(weeks[i - 1].week_start).getMonth();
    if (first) svg.append(svgEl("text", { x: x + 2, y: H - padB + 18, "font-size": 12, fill: "var(--muted)" }, fmtDate(w.week_start, { month: "short" })));
    if (i === 0 || weeks[i - 1].phase !== w.phase) {
      let j = i; while (j < weeks.length && weeks[j].phase === w.phase) j++;
      svg.append(svgEl("rect", { x: x + 1, y: H - padB + 28, width: (j - i) * bw - 2, height: 6, rx: 3, fill: phaseColor(w.phase) }));
      if ((j - i) * bw > 60) svg.append(svgEl("text", { x: x + 2, y: H - padB + 48, "font-size": 12, fill: "var(--fg)" }, t.phase[w.phase] || w.phase));
    }
  });
  svg.append(svgEl("line", { x1: padL, x2: W - padR, y1: y(0), y2: y(0), stroke: "var(--muted)", "stroke-width": 1 }));
  if (actualPts.length > 1) svg.append(svgEl("polyline", { points: actualPts.map(p => p.join(",")).join(" "), fill: "none", stroke: "var(--fg)", "stroke-width": 2 }));
  actualPts.forEach(([cx, cy]) => svg.append(svgEl("circle", { cx, cy, r: 4, fill: "var(--fg)", stroke: "var(--surface)", "stroke-width": 1.5 })));
}

function renderWeek(cur, t) {
  const days = (cur && cur.days) || [];
  $("weekSection").hidden = !days.length;
  $("hWeek").textContent = t.week;
  const todayIso = new Date().toISOString().slice(0, 10);
  $("days").replaceChildren(...days.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(d => {
    const li = el("li", { class: (d.date === todayIso ? "today " : "") + (d.done ? "done" : "") });
    const title = el("span", { class: "t" }, d.title || "");
    if (d.done) title.prepend(el("span", { class: "ok" }, "✓ "));
    const vol = d.km ? `${d.km} km` : d.minutes ? `${d.minutes} min` : "";
    li.append(el("span", { class: "d" }, fmtDate(d.date, { weekday: "short", day: "numeric", month: "numeric" })), title,
      el("span", { class: "v" }, vol));
    return li;
  }));
}

function miniChart(svg, points, opts) {
  // points: [{x: Date, y: number, lo?, hi?, color?}]; draws a band, a line and dots on one scale
  svg.replaceChildren();
  const W = 520, H = 180, pl = opts.padL || 34, pr = 10, pt = 10, pb = 24;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if (!points.length) return;
  const xs = points.map(p => +p.x), x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  const ys = points.flatMap(p => [p.y, p.lo, p.hi].filter(v => v != null));
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * 0.15 || 1; y0 -= pad; y1 += pad;
  if (opts.ref != null) { y0 = Math.min(y0, opts.ref - pad); y1 = Math.max(y1, opts.ref + pad); }
  const frac = v => (v - y0) / (y1 - y0);
  const X = v => pl + (W - pl - pr) * ((+v - x0) / ((x1 - x0) || 1)), Y = v => pt + (H - pt - pb) * (opts.invert ? frac(v) : 1 - frac(v));
  [y0 + pad, (y0 + y1) / 2, y1 - pad].forEach(v => {
    svg.append(svgEl("line", { x1: pl, x2: W - pr, y1: Y(v), y2: Y(v), stroke: "var(--line)" }));
    svg.append(svgEl("text", { x: pl - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, opts.fmt(v)));
  });
  if (opts.ref != null) svg.append(svgEl("line", { x1: pl, x2: W - pr, y1: Y(opts.ref), y2: Y(opts.ref), stroke: "var(--accent)", "stroke-dasharray": "5 4", "stroke-width": 1.5 }));
  const banded = points.filter(p => p.lo != null && p.hi != null);
  if (banded.length > 1) {
    const top = banded.map(p => `${X(p.x)},${Y(p.hi)}`), bottom = banded.slice().reverse().map(p => `${X(p.x)},${Y(p.lo)}`);
    svg.append(svgEl("polygon", { points: top.concat(bottom).join(" "), fill: "var(--good)", opacity: 0.15 }));
  }
  if (opts.line && points.length > 1)
    svg.append(svgEl("polyline", { points: points.map(p => `${X(p.x)},${Y(p.y)}`).join(" "), fill: "none", stroke: "var(--fg)", "stroke-width": 2 }));
  points.forEach(p => svg.append(svgEl("circle", { cx: X(p.x), cy: Y(p.y), r: opts.line ? 2.5 : 4, fill: p.color || "var(--fg)" })));
  const first = new Date(x0), last = new Date(x1);
  svg.append(svgEl("text", { x: pl, y: H - 6, "font-size": 11, fill: "var(--muted)" }, fmtDate(first.toISOString().slice(0, 10))));
  svg.append(svgEl("text", { x: W - pr, y: H - 6, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, fmtDate(last.toISOString().slice(0, 10))));
}

function renderTrends(t) {
  const tr = state.trends.filter(r => r.hrv7 != null).sort((a, b) => a.date < b.date ? -1 : 1).slice(-56);
  const se = state.sessions.filter(r => r.kind === "steady" && r.ef).sort((a, b) => a.date < b.date ? -1 : 1).slice(-20);
  $("readySection").hidden = !tr.length; $("efSection").hidden = !se.length;
  $("trendRow").hidden = !tr.length && !se.length;
  $("hReady").textContent = t.ready; $("hEf").textContent = t.ef;
  const col = v => v === "RED" ? "var(--race)" : v === "AMBER" ? "var(--warn)" : "var(--good)";
  if (tr.length) {
    miniChart($("readyChart"), tr.map(r => ({ x: new Date(r.date + "T12:00:00"), y: r.hrv7, lo: r.band_lo, hi: r.band_hi, color: col(r.verdict) })),
      { line: true, fmt: v => v.toFixed(0) });
    const l = tr[tr.length - 1];
    $("readyCap").textContent = `${fmtDate(l.date)} · ${t.verdict[l.verdict] || l.verdict} · ` + t.readyCap(l.hrv7.toFixed(0), (l.band_lo || 0).toFixed(0), (l.band_hi || 0).toFixed(0));
  }
  if (se.length) {
    miniChart($("efChart"), se.map(r => ({ x: new Date(r.date + "T12:00:00"), y: r.ef, color: r.decoupling > 10 ? "var(--race)" : r.decoupling > 5 ? "var(--warn)" : "var(--good)" })),
      { line: false, fmt: v => v.toFixed(2) });
    const l = se[se.length - 1];
    $("efCap").textContent = t.efCap(se.length, l.decoupling != null ? l.decoupling.toFixed(1) : null);
  }
}

function renderPredictions(t) {
  const rows = state.predictions || [], todayIso = new Date().toISOString().slice(0, 10);
  const dist = km => Math.abs(km - 21.0975) < 0.2 ? t.half : Math.abs(km - 42.195) < 0.3 ? t.marathon : `${+km.toFixed(2)} km`;
  const groups = {};
  rows.filter(r => r.kind === "race" && r.race_date >= todayIso).forEach(r => { (groups[`${r.race_date}|${r.km}`] ||= []).push(r); });
  const now = rows.filter(r => r.kind === "now"), lastNow = now.reduce((a, r) => r.date > a ? r.date : a, "");
  const form = now.filter(r => r.date === lastNow).sort((a, b) => a.km - b.km);
  $("predSection").hidden = !Object.keys(groups).length && !form.length;
  $("hPred").textContent = t.pred; $("hForm").textContent = t.form;
  const box = $("predRaces"); box.replaceChildren();
  Object.values(groups).sort((a, b) => a[0].race_date < b[0].race_date ? -1 : 1).forEach(g => {
    g.sort((a, b) => a.date < b.date ? -1 : 1);
    const l = g[g.length - 1], p = el("div", { class: "panel pred" });
    p.append(el("div", { class: "eyebrow" }, `${l.name} · ${fmtDate(l.race_date, { day: "numeric", month: "numeric", year: "numeric" })} · ${dist(l.km)}`),
      el("div", { class: "big" }, fmtT(l.mid)),
      el("div", { class: "sub" }, `${t.likely} · ${t.range} ${fmtT(l.low)}–${fmtT(l.high)}`));
    if (l.goal) {
      const gap = ((l.low - l.goal) / l.low * 100).toFixed(1);
      const [cls, txt] = l.goal >= l.low && l.goal <= l.high ? ["ok", t.inRange] : l.goal > l.high ? ["ok", t.safe]
        : gap <= 3 ? ["warn", t.stretch(gap)] : ["off", t.outOf(gap)];
      const d = el("div", { class: "sub" }); d.append(`${t.goal(fmtT(l.goal))} · `, el("span", { class: `gap ${cls}` }, txt)); p.append(d);
    }
    if (g.length > 1) {
      const svg = svgEl("svg", { role: "img", "aria-label": t.trendCap });
      p.append(svg, el("div", { class: "cap" }, t.trendCap));
      miniChart(svg, g.map(r => ({ x: new Date(r.date + "T12:00:00"), y: r.mid, lo: r.low, hi: r.high })),
        { line: true, invert: true, ref: l.goal || null, padL: 56, fmt: v => fmtT(v) });
    }
    box.append(p);
  });
  $("formPanel").hidden = !form.length;
  $("formHead").replaceChildren(...t.formCols.map((c, i) => el("th", i ? { style: "text-align:right" } : {}, c)));
  $("formBody").replaceChildren(...form.map(r => {
    const tr = el("tr");
    tr.append(el("td", {}, dist(r.km)), el("td", { class: "n" }, fmtT(r.mid)), el("td", { class: "n" }, `${fmtT(r.low)}–${fmtT(r.high)}`),
      el("td", { class: "n" }, `${fmtT(r.mid / r.km)}/km`));
    return tr;
  }));
  $("predCap").textContent = lastNow ? t.predCap(fmtDate(lastNow, { day: "numeric", month: "numeric", year: "numeric" })) : "";
}

async function start() {
  showEmpty("loading", "emptyX");
  let settled = false;
  const timer = setTimeout(() => { if (!settled) showEmpty("failT", "failX"); }, 10000);
  const db = await claude.use("db");
  if (!db) { clearTimeout(timer); showEmpty("failT", "failX"); return; }
  const done = () => { if (!settled) { settled = true; clearTimeout(timer); } };
  const fail = () => { done(); if (!state.weeks) showEmpty("failT", "failX"); };
  db.doc("plan/meta").onSnapshot(s => { state.meta = s.data() || {}; done(); render(); }, fail);
  db.collection("weeks").onSnapshot(s => { state.weeks = s.docs.map(d => d.data()); done(); render(); }, fail);
  db.collection("changes").onSnapshot(s => { state.changes = s.docs.map(d => d.data()); render(); }, () => {});
  db.collection("trends").onSnapshot(s => { state.trends = s.docs.map(d => d.data()); render(); }, () => {});
  db.collection("sessions").onSnapshot(s => { state.sessions = s.docs.map(d => d.data()); render(); }, () => {});
  db.collection("predictions").onSnapshot(s => { state.predictions = s.docs.map(d => d.data()); render(); }, () => {});
}
start();
</script>
